plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.doulgs'
version = '0.0.1-SNAPSHOT'
description = 'TestYourLuck API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.13.0'
    springdocVersion = '3.2.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.awaitility:awaitility'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Gera apenas o jar executável (sem o "-plain.jar").
tasks.named('jar') {
    enabled = false
}

// Execução local usa o profile dev (ou -Pprofile=stage); o artefato empacotado mantém o default (production).
// Propriedade de sistema tem precedência sobre a variável SPRING_PROFILES_ACTIVE de outros projetos no shell.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', project.findProperty('profile') ?: 'dev'
}

// Testes unitários (*Test).
tasks.named('test') {
    useJUnitPlatform()
    exclude '**/*IT.class'
    finalizedBy jacocoTestReport
}

// Testes de integração (*IT) contra o Postgres/Redis do docker-compose.
def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Executa os testes de integração (*IT) contra o Postgres e o Redis do docker-compose.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class'
    shouldRunAfter tasks.named('test')
    finalizedBy jacocoTestReport
}

tasks.named('check') {
    dependsOn integrationTest
}

jacocoTestReport {
    executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
    reports {
        xml.required = true
        html.required = true
    }
}
